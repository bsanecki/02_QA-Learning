name: Postman API Tests

on:
  push:
    paths:
      - "04_Postman-API-Testing/02_Postman-API-CI-Github-Actions/**"
      - ".github/workflows/postman-tests.yml"
  pull_request:
    paths:
      - "04_Postman-API-Testing/02_Postman-API-CI-Github-Actions/**"
      - ".github/workflows/postman-tests.yml"

jobs:
  postman-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman tests
        run: |
          newman run \
            "04_Postman-API-Testing/02_Postman-API-CI-Github-Actions/postman-api-ci-cd.postman_collection.json"
